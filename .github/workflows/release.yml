name: Publish Package

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Debug - Check token availability
        run: |
          echo "Checking token availability..."
          echo "GITHUB_TOKEN exists: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "NPM_TOKEN exists: ${{ secrets.NPM_TOKEN != '' }}"
          if [ -n "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN env is set"; else echo "GITHUB_TOKEN env is NOT set"; fi
          if [ -n "$NPM_TOKEN" ]; then echo "NPM_TOKEN env is set"; else echo "NPM_TOKEN env is NOT set"; fi
          echo "GITHUB_TOKEN prefix: ${GITHUB_TOKEN:0:4}..."
          echo "NPM_TOKEN prefix: ${NPM_TOKEN:0:4}..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npx semantic-release
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
